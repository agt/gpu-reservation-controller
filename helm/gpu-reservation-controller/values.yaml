# Default values for gpu-reservation-controller.
#
# Note: replica count is intentionally not configurable — the controller holds
# in-memory queue state, so the Deployment hardcodes replicas: 1.

image:
  repository: gpu-reservation-controller
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Required application configuration
# ---------------------------------------------------------------------------

# Base URL of the reservation management API (required).
# Example: https://gpures.example.edu
reservationApiUrl: ""

# Reference to a pre-existing Secret containing the API service key.
# The Secret must exist in the release namespace before deploying this chart.
# The key value is injected as the RESERVATION_API_KEY environment variable.
apiKeySecret:
  name: gpu-reservation-api-key
  key: api-key

# Reference to a pre-existing Secret holding the bearer token for the inbound
# reservation-push API (POST /api/reservations/push). Leave `name` empty to keep
# the endpoint disabled (it returns 503 until INBOUND_API_TOKEN is set). When
# set, the Secret must exist in the release namespace before deploying; the value
# is injected as the INBOUND_API_TOKEN environment variable.
inboundApiTokenSecret:
  name: ""
  key: token

# ---------------------------------------------------------------------------
# Optional tuning — defaults mirror application defaults
# ---------------------------------------------------------------------------

config:
  # Seconds between reservation refresh cycles.
  reservationFetchInterval: 300

  # Seconds between queue-processor ticks (the whole work-queue loop: pod LIST,
  # JIT lease retries, no-show cancels, overstay adoption).
  queueProcessorInterval: 300

  # Calendar days ahead to fetch reservations.
  reservationLookaheadDays: 7

  # Bind port for the whole HTTP listener (GET /health liveness plus the inbound
  # push and preemption-risk forecast APIs).
  httpPort: 8000

  # Enable the JIT on-demand lease path: request a real on-demand reservation for
  # a pending pod with no open reservation window (set to false to disable).
  ondemandLeaseEnabled: true

  # Reserved-match horizon (minutes) for the JIT trigger: a pod is queued for
  # its own reservation when one opens now or within this many minutes and has
  # budget; otherwise, if the pod is JIT-eligible, the controller requests an
  # on-demand lease instead of waiting.
  ondemandHorizonMinutes: 30

  # Minutes added to a pod's horae/minimum-runtime-seconds annotation when
  # sizing the duration of a requested JIT lease.
  ondemandLeaseBufferMinutes: 10

  # Delegate on-demand admission selection to the app for LAS prioritization:
  # the controller offers the batch of eligible pending pods to
  # POST /api/reservations/ondemand-admission and admits only the subset the app
  # grants. Opt-in — leave false until the app implements the endpoint; false
  # (or any app-call failure) grants every eligible candidate (greedy per-pod).
  ondemandDelegateAdmission: false

  # Minutes after a reservation window opens before the holder is declared a
  # no-show and the controller durably cancels it app-side, freeing the
  # window for re-booking.
  noshowTimeoutMinutes: 15

  # Grace period (minutes) after controller startup before no-shows are
  # declared for windows already in progress.
  noshowGraceMinutes: 30

  # IANA timezone; affects log timestamp display only (reservation window
  # arithmetic is UTC-based and does not depend on it).
  # Leave empty to use the container's system default.
  # Example: America/Los_Angeles
  timezone: ""

  # Log level: DEBUG, INFO, WARNING, ERROR
  logLevel: "INFO"

  # Name of the SchedulingGate to remove when admitting a pod.
  # Leave empty to disable scheduling gate management.
  podSchedulingGateName: ""

  # Optional pod label naming the usage group a pod belongs to (e.g.
  # "dsmlp/course").  When set, the controller additionally requires the pod's
  # value for this label to equal the reservation's group name before admitting
  # it, adopting it, or chain-extending its guarantee — an extra match axis
  # alongside gpu-class.  Leave empty to disable (no group constraint).
  requiredGroupLabel: ""

  # Minutes before an upcoming reservation slot boundary that the preemption
  # sweep's phase-A pass runs (proactively frees capacity from overstaying
  # pods so the incoming reservation has room when its window opens).
  preemptionLeadMinutes: 15

  # Seconds between preemption sweeps (checks whether any upcoming boundary
  # needs capacity freed, and whether any just-expired blocks need cleanup).
  preemptionCheckInterval: 60

  # Seconds between app-side vs physical GPU capacity audits (default hourly).
  # Each audit compares the reservation app's per-class total_gpus against the
  # GPUs physically present in the cluster, logs any difference as a WARNING,
  # and pauses new on-demand admissions for any class the app over-counts.
  capacityCheckInterval: 3600

  # Re-link an overstay pod (one running past its runtime guarantee) to a
  # reservation the same user has since booked, so it is no longer eligible
  # for preemption.  Set to false to disable.
  podAdoptionEnabled: true

  # Merge a JIT on-demand lease's pod into the user's matching booking the moment
  # that booking's window opens (re-link the pod, retire the lease penalty-exempt),
  # without waiting for the lease guarantee to lapse.  Set to false to disable
  # (the pod then converges lazily via adoption once past its lease guarantee).
  ondemandMergeEnabled: true

  # Stamp pods at risk of demand-driven preemption with informational
  # horae/termination-warning-* annotations (projected termination time, risk
  # score, and a human-readable message) after each preemption sweep.  Purely
  # informational — nothing is enforced.  Set to false to disable.
  terminationWarningEnabled: true

  # Delegate preemption victim selection to the reservation app
  # (POST /api/reservations/preemption-victims) so prioritisation policy lives
  # there.  Set to false — or let any app-call failure occur — to fall back to
  # local uniform-random selection.
  preemptionDelegateSelection: true

# ---------------------------------------------------------------------------
# ServiceAccount and RBAC
# ---------------------------------------------------------------------------

serviceAccount:
  # Set to false to use an existing ServiceAccount specified by .name below.
  create: true
  # If empty and create=true, defaults to the fully-qualified release name.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Service (exposes the /health endpoint within the cluster)
# ---------------------------------------------------------------------------

service:
  type: ClusterIP
  port: 8000

# ---------------------------------------------------------------------------
# Deployment tuning
# ---------------------------------------------------------------------------

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Additional arbitrary environment variables injected into the container.
# Accepts the same structure as a Kubernetes EnvVar list entry, so both
# plain values and secretKeyRef/configMapKeyRef sources are supported.
# Example:
#   extraEnv:
#     - name: HTTP_PROXY
#       value: "http://proxy.example.com:3128"
extraEnv: []
