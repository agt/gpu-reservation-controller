name: Build and push image
on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the Dockerfile's `test` stage, which ends in `RUN pytest`, so a
      # failing suite fails the job. This step is required: `test` is not in the
      # build graph of the default `final` target, so BuildKit prunes it and the
      # push build below never runs a single test.
      #
      # Deliberately before the registry login — a broken commit should fail
      # without the job ever authenticating, let alone publishing.
      - name: Run tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
